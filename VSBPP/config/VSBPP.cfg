RCSPstopCutGenTimeThresholdInPricing = 5 # \tau^{\mathrm{soft}}
RCSPhardTimeThresholdInPricing = 10      # \tau^{\mathrm{hard}}
# VRPSolver configuration for the variable-sized bin packing with penalties demo
ApplyPreprocessing = false
MaxNbOfBBtreeNodeTreated = 1000000000 # no practical node limit (BaPCod default is 100000)

RCSPnumberOfBucketsPerVertex = 100 # \psi^{\mathrm{buck}}
RCSPdynamicBucketSteps = 0         # \psi^{\mathrm{reduc}}, 1 = on, 0 = off
RCSPuseBidirectionalSearch = 1     # \phi^{\mathrm{bidir}}, 0 = off, 1 = always on, 2 = on only for exact pricing

RCSPmaxNumOfColsPerExactIteration = 10 # \gamma^{\mathrm{exact}}
RCSPmaxNumOfColsPerIteration = 10      # \gamma^{\mathrm{heur}}

RCSPmaxNumOfLabelsInEnumeration = 100000 # \omega^{\mathrm{labels}}
RCSPmaxNumOfEnumeratedSolutions = 200000 # \omega^{\mathrm{routes}}
MaxNumOfEnumSolutionsForMIP = 4000       # \omega^{\mathrm{MIP}} (BaPCod default is 10000: end-of-node MIPs with that many
                                         # enumerated patterns can be very slow with CPLEX)

RCSPinitNGneighbourhoodSize = 0 # \eta^{\mathrm{init}}
RCSPmaxNGneighbourhoodSize = 0  # \eta^{\mathrm{max}}
RCSPrankOneCutsMaxNumRows = 3   # \theta^{\mathrm{rows}}

