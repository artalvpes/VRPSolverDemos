# RCSPuseBidirectionalSearch = 1            # \phi^{\mathrm{bidir}}
RCSPmaxNGneighbourhoodSize = 32           # \eta^{\mathrm{max}}
RCSPmaxNumOfEnumeratedSolutions = 10000000 # \omega^{\mathrm{routes}}
RCSPrankOneCutsMaxNumRows = 0
# Rank-1 cuts are disabled: they pay off only on some instances. To enable them (up to 3 rows, full memory), replace
# the line above by the two lines below.
# RCSPrankOneCutsMaxNumRows = 3
# RCSPrankOneCutsMemoryType = 3
# Use full memory (type 3): limited memory works well in vehicle routing, where the customers have locality, but
# there is no locality among the jobs, so the columns can avoid the memory of a cut without increasing their cost,
# and limited-memory cuts barely improve the bound. Arc memory (type 1) also needs much more memory (12 GB instead
# of 5 GB on wt40-4m-56). The cuts may help on "tight" instances, with large costs and many late jobs (root bound
# of wt40-4m-61: 7321 without the cuts, 7334 with them, optimum 7357), at the price of a root about 3 times slower.
# On "loose" instances, with small costs and few late jobs, there are many alternative columns of the same cost:
# the cuts do not improve the bound (wt40-4m-56: 816 with and without them, optimum 826) and make the pricing much
# slower (wt40-4m-1: about 35 s per node instead of 1.5 s).
