# Parameters of the CVRP.cfg of the code of Oliveira, Lima, Pessoa and Roboredo (2025) for the VRPDA, with
# RCSPmaxNumOfEnumSolutionsForMIP renamed to MaxNumOfEnumSolutionsForMIP (name of the current BaPCod).
# Notation of the Math. Prog. paper on VRPSolver (Pessoa et al., 2020) in the comments.

ApplyPreprocessing = false
MaxNbOfStagesInColGenProcedure = 3
colGenSubProbSolMode = 3
MipSolverMultiThread = 1
ApplyStrongBranchingEvaluation = true
MaxNbOfBBtreeNodeTreated = 1000000000 # no practical node limit (BaPCod default is 100000)

RCSPstopCutGenTimeThresholdInPricing = 5 # \tau^{\mathrm{soft}}
RCSPhardTimeThresholdInPricing = 10      # \tau^{\mathrm{hard}}
RCSPmaxNumOfLabelsInEnumeration = 500000  # \omega^{\mathrm{labels}}
RCSPmaxNumOfEnumeratedSolutions = 5000000 # \omega^{\mathrm{routes}}
MaxNumOfEnumSolutionsForMIP = 10000       # \omega^{\mathrm{MIP}}
ColumnCleanupThreshold = 5000 # master columns kept after a clean-up (critical for the LP time)
#RCSPredCostFixingTimeThreshold = 200

RCSPrankOneCutsMaxNumPerRound = 200
RCSPrankOneCutsMaxNumRows = 3       # \theta^{\mathrm{rows}}
RCSPrankOneCutsMemoryType = 1       # \theta^{\mathrm{mem}}: 0 = automatic, 1 = arc, 2 = vertex, 3 = full

CutTailingOffThreshold = 0.01       # \delta^{\mathrm{gap}}
CutTailingOffCounterThreshold = 3

StrongBranchingPhaseOneCandidatesNumber = 100    # \zeta_1^{\mathrm{num}}
StrongBranchingPhaseOneTreeSizeEstimRatio = 0.2  # \zeta_1^{\mathrm{estim}}
StrongBranchingPhaseTwoCandidatesNumber = 3      # \zeta_2^{\mathrm{num}}
StrongBranchingPhaseTwoTreeSizeEstimRatio = 0.02 # \zeta_2^{\mathrm{estim}}

DEFAULTPRINTLEVEL = -1
